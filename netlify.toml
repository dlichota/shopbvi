[build]
  publish = "."

# The service worker must always be revalidated, otherwise a stale copy keeps
# serving an old app shell and updates never reach installed users.
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sheet sync responses are per-request state; never let a CDN or browser hold them.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
